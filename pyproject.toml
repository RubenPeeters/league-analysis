[project]
name = "top-players-league"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymongo[srv]>=4.15.5",
    "python-dotenv>=1.2.1",
    "riotwatcher>=3.3.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
