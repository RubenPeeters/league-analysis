<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta over patches - Elite Meta Scout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header-container">
        <div class="title-section">
            <h1>Meta over patches</h1>
            <div class="subtitle">How the tracked top-ladder meta changed per patch</div>
            <a class="page-link" href="index.html">← Current patch</a>
        </div>

        <div class="role-selector" id="role-nav">
            <button class="role-btn" data-role="TOP" onclick="setRole('TOP')" title="Top"><img
                    src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-top.svg"
                    class="role-icon"><span>TOP</span></button>
            <button class="role-btn active" data-role="JUNGLE" onclick="setRole('JUNGLE')" title="Jungle"><img
                    src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-jungle.svg"
                    class="role-icon"><span>JUNGLE</span></button>
            <button class="role-btn" data-role="MIDDLE" onclick="setRole('MIDDLE')" title="Mid"><img
                    src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-middle.svg"
                    class="role-icon"><span>MID</span></button>
            <button class="role-btn" data-role="BOTTOM" onclick="setRole('BOTTOM')" title="Bot"><img
                    src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-bottom.svg"
                    class="role-icon"><span>BOT</span></button>
            <button class="role-btn" data-role="UTILITY" onclick="setRole('UTILITY')" title="Support"><img
                    src="https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/svg/position-utility.svg"
                    class="role-icon"><span>SUP</span></button>
        </div>


        <div class="role-selector" id="region-nav">
            <button class="active" data-region="kr" onclick="setRegion('kr')">KR</button>
            <button data-region="euw1" onclick="setRegion('euw1')">EUW</button>
        </div>
    </div>

    <div class="history-container">
        <p class="history-note" id="history-note">Loading…</p>
        <div class="region-card">
            <div class="history-scroll">
                <table id="history-grid"></table>
            </div>
            <div class="history-note" id="cell-detail"></div>
        </div>
        <div class="grid-container summary-grid" id="history-summary"></div>
    </div>

    <script src="history.js"></script>
</body>

</html>
