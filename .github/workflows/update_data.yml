name: Update Jungle Meta

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:      # Manual trigger button
  push:
    branches:
      - main

permissions:
  contents: write

# One run at a time: runs share the Riot rate limit, the database and the data branch.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip workflow if commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install riotwatcher python-dotenv requests "pymongo[srv]"

      # 0. FETCH THE PER-PATCH ARCHIVE (the generator updates it; it lives on the data branch)
      - name: Fetch history.json from data branch
        run: |
          git fetch --depth=1 origin data
          mkdir -p data
          git show FETCH_HEAD:history.json > data/history.json || rm -f data/history.json

      # 1. GENERATE FRESH DATA
      - name: Run Data Generator
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PLAYER_COUNT: 20
          LOG_LEVEL: INFO
        run: python src/main.py

      # 2. COMMIT DATA TO THE `data` BRANCH (So you keep your history; main is protected)
      - name: Commit Data to data branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch --depth=1 origin data
          git worktree add --detach _data FETCH_HEAD
          cp data/data.json _data/data.json
          if [ -f data/history.json ]; then cp data/history.json _data/history.json; fi
          cd _data
          git add -A .
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update data"
          git push origin HEAD:data
          cd ..
          git worktree remove --force _data

      # 3. ASSEMBLE THE SITE (The Magic Step)
      - name: Assemble Website
        run: |
          # Create a clean temporary folder for the website
          mkdir _site
          
          # Copy all FRONTEND files to the ROOT of _site
          cp -r ui/* _site/
          
          # Copy the DATA folder into _site
          cp -r data _site/
          
          # Debug: List the files to ensure structure is correct (Check logs if it fails)
          ls -R _site

      # 4. DEPLOY TO GITHUB PAGES
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true # This completely overwrites the gh-pages branch (Cleaner)